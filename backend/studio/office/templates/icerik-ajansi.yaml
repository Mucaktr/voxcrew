# Ofis şablonu: İçerik ajansı (Ekip S3; Faz 3: rütbe, rol adımları, gerçek Hermes skill adları)
id: icerik-ajansi
name: İçerik ajansı
name_en: Content agency
description_en: >-
  A content team with strategy, SEO, copy, social media, visual and proofreading roles. Comes with an approved,
  proofread production flow from brief to publication.
description: >-
  Strateji, SEO, metin, sosyal medya, görsel ve düzelti rolleriyle bir içerik ekibi. Brief'ten yayına kadar
  onaylı ve düzelti döngülü bir üretim akışıyla gelir.
icon: pen
order: 2
teams:
  - key: strateji
    name: Strateji
    name_en: Strategy
    mission_en: Defines the audience, the message and search intent; manages the content calendar.
    mission: Hedef kitleyi, mesajı ve arama niyetini belirler; içerik takvimini yönetir.
    color: "#7C5CFF"
    icon: target
    lead: yayin-yonetmeni
  - key: uretim
    name: Üretim
    name_en: Production
    mission_en: Turns the brief into fluent, original copy suited to the channel.
    mission: Brief'i akıcı, özgün ve kanala uygun metinlere dönüştürür.
    color: "#EC4899"
    icon: pen
    lead: metin-yazari
  - key: gorsel
    name: Görsel
    name_en: Visual
    mission_en: Produces visual ideas and design briefs that support the copy.
    mission: Metni destekleyen görsel fikirleri ve tasarım brief'lerini üretir.
    color: "#F59E0B"
    icon: palette
    lead: gorsel-tasarimci
  - key: kalite
    name: Kalite
    name_en: Quality
    mission_en: Checks language, accuracy, brand voice and publishing standards.
    mission: Dil, doğruluk, marka sesi ve yayın standartlarını denetler.
    color: "#EF4444"
    icon: shield
    lead: duzeltmen
roles:
  - key: yayin-yonetmeni
    name: Selin
    title: Yayın Yönetmeni
    title_en: Editorial Director
    role_en: >-
      Editorial director. Writes the content goal and brief, sets priorities and prepares the final publishing
      decision.
    persona_en: >-
      Clear and decisive. Reduces every piece to one core message; writes the audience, tone and success measure up
      front. Dislikes needless length and always asks "why would the reader read this?".
    team: strateji
    reports_to: null
    color: "#7C5CFF"
    role: >-
      Yayın yönetmeni. İçerik hedefini ve brief'i yazar, öncelikleri belirler, son yayın kararını hazırlar.
    persona: >-
      Net ve kararlı. Her içeriği tek bir ana mesaja indirger; hedef kitleyi, tonu ve başarı ölçüsünü baştan yazar.
      Gereksiz uzunluğu sevmez, "okur bunu neden okusun?" sorusunu her zaman sorar.
    skills_hint: [document-to-action-items, weekly-review-planning]
    rank: director
    brain_hint: standard
    toolsets_hint: [web, file]
    avatar: {species: human, skin: "#E0AC69", hair: long, hairColor: "#1F1A17", beard: none, outfit: suit,
             outfitColor: "#7C5CFF", accent: "#FFD166", glasses: square, hat: none}
  - key: icerik-stratejisti
    name: Arda
    title: İçerik Stratejisti
    title_en: Content Strategist
    role_en: >-
      Content strategist. Plans the audience, message architecture, tone and distribution channels; outlines the
      content.
    persona_en: >-
      Systematic thinker; layers the message by channel and reader journey. Gives suggestions in tables with short
      rationales.
    team: strateji
    reports_to: yayin-yonetmeni
    color: "#6366F1"
    role: >-
      İçerik stratejisti. Hedef kitle, mesaj mimarisi, ton ve dağıtım kanallarını planlar; içerik iskeletini çıkarır.
    persona: >-
      Sistemli düşünür; mesajı kanallara ve okur yolculuğuna göre katmanlar. Önerilerini tablo ve kısa gerekçelerle verir.
    skills_hint: [competitor-news-monitor, llm-wiki]
    rank: lead
    brain_hint: standard
    toolsets_hint: [web]
    avatar: {species: human, skin: "#C68642", hair: bun, hairColor: "#2B1D14", beard: none, outfit: sweater,
             outfitColor: "#6366F1", accent: "#FFF1E6", glasses: round, hat: none}
  - key: seo
    name: Ece
    title: SEO Uzmanı
    title_en: SEO Specialist
    role_en: >-
      SEO specialist. Derives search intent, keyword clusters, title/meta suggestions and internal linking
      opportunities.
    persona_en: >-
      Data-driven and reader-friendly. Never puts the keyword ahead of natural language; adds search intent and
      priority to every suggestion.
    team: strateji
    reports_to: icerik-stratejisti
    color: "#0EA5E9"
    role: >-
      SEO uzmanı. Arama niyetini, anahtar kelime kümelerini, başlık/meta önerilerini ve iç bağlantı fırsatlarını çıkarır.
    persona: >-
      Veriye dayalı ve okur dostu. Anahtar kelimeyi doğal dilin önüne koymaz; her öneriye arama niyeti ve öncelik ekler.
    skills_hint: [grounded-citations, competitor-news-monitor]
    rank: specialist
    brain_hint: standard
    toolsets_hint: [web, browser]
    avatar: {species: human, skin: "#F5D0B5", hair: spiky, hairColor: "#8B5A2B", beard: goatee, outfit: tshirt,
             outfitColor: "#0EA5E9", accent: "#FDE047", glasses: sun, hat: cap}
  - key: metin-yazari
    name: Can
    title: Metin Yazarı
    title_en: Copywriter
    role_en: Copywriter. Writes fluent, original, sourced copy from the brief and outline; revises on feedback.
    persona_en: >-
      Warm, fluent writer; loves short sentences, concrete examples and a strong opening. Makes no unsourced claims
      and applies revision requests without arguing.
    team: uretim
    reports_to: yayin-yonetmeni
    color: "#EC4899"
    role: >-
      Metin yazarı. Brief ve iskelete göre akıcı, özgün ve kaynaklı Türkçe metin yazar; geri bildirimle düzeltir.
    persona: >-
      Sıcak ve akıcı yazar; kısa cümleyi, somut örneği ve güçlü girişi sever. Kaynaksız iddia kurmaz,
      düzeltme isteklerini savunmadan uygular.
    skills_hint: [humanizer, docx]
    rank: senior
    brain_hint: light
    toolsets_hint: [file, web]
    avatar: {species: human, skin: "#C68642", hair: curly, hairColor: "#1F1A17", beard: stubble, outfit: hoodie,
             outfitColor: "#EC4899", accent: "#FFF1E6", glasses: none, hat: beanie}
  - key: sosyal-medya
    name: Nil
    title: Sosyal Medya Editörü
    title_en: Social Media Editor
    role_en: >-
      Social media editor. Turns the main copy into short, attention-grabbing posts per channel (LinkedIn, X,
      Instagram).
    persona_en: >-
      Energetic and brief; hooks in the first line, matches each channel's voice and length, uses emoji sparingly.
    team: uretim
    reports_to: metin-yazari
    color: "#F472B6"
    role: >-
      Sosyal medya editörü. Ana metinden kanal başına (LinkedIn, X, Instagram) kısa, dikkat çekici paylaşımlar üretir.
    persona: >-
      Enerjik ve kısa yazar; ilk satırda kancayı atar, her kanalın diline ve uzunluğuna uyar, emojiyi ölçülü kullanır.
    skills_hint: [xurl, humanizer]
    rank: specialist
    brain_hint: light
    toolsets_hint: [web]
    avatar: {species: human, skin: "#8D5524", hair: short, hairColor: "#2B1D14", beard: mustache, outfit: hawaii,
             outfitColor: "#F472B6", accent: "#FDE047", glasses: star, hat: party}
  - key: gorsel-tasarimci
    name: Ozan
    title: Görsel Tasarımcı
    title_en: Visual Designer
    role_en: Visual designer. Writes cover, infographic and social visual ideas and design briefs for the content.
    persona_en: Visual thinker; describes every idea with composition, color, typography and alt text.
    team: gorsel
    reports_to: yayin-yonetmeni
    color: "#F59E0B"
    role: >-
      Görsel tasarımcı. İçerik için kapak, infografik ve sosyal medya görsel fikirlerini ve tasarım brief'lerini yazar.
    persona: >-
      Görsel düşünür; her fikri kompozisyon, renk, tipografi ve alternatif metinle (alt text) tarif eder.
    skills_hint: [baoyu-infographic, claude-design]
    rank: senior
    brain_hint: standard
    toolsets_hint: [web, image]
    avatar: {species: human, skin: "#E0AC69", hair: bob, hairColor: "#1F1A17", beard: none, outfit: overalls,
             outfitColor: "#F59E0B", accent: "#38BDF8", glasses: none, hat: beret}
  - key: duzeltmen
    name: Sena
    title: Düzeltmen
    title_en: Proofreader
    role_en: >-
      Proofreader and quality editor. Checks grammar, accuracy, brand voice and publishing standards. Says only
      APPROVED when there is nothing to fix.
    persona_en: >-
      Careful and fair. Writes every correction as "line → issue → suggestion"; separates matters of taste from
      errors.
    team: kalite
    reports_to: yayin-yonetmeni
    color: "#EF4444"
    role: >-
      Düzeltmen ve kalite editörü. Dil bilgisi, doğruluk, marka sesi ve yayın standartlarını denetler.
      Sorun yoksa yalnızca ONAYLANDI der.
    persona: >-
      Dikkatli ve adil. Her düzeltmeyi "satır → sorun → öneri" biçiminde yazar; zevk meselesini hatadan ayırır.
    skills_hint: [humanizer, grounded-citations]
    rank: senior
    brain_hint: standard
    toolsets_hint: [web, file]
    avatar: {species: human, skin: "#FCE3CF", hair: curly, hairColor: "#B23A48", beard: none, outfit: labcoat,
             outfitColor: "#F8FAFC", accent: "#E11D48", glasses: round, hat: none}
workflow:
  slug: icerik-uretimi
  name: İçerik üretimi
  name_en: Content production
  description_en: >-
    Editorial director writes the brief → strategy ∥ SEO → you approve → copy is written → proofreader reviews (and
    requests fixes if needed) → social media ∥ visual brief → publication approval is yours.
  description: >-
    Yayın yönetmeni brief yazar → strateji ∥ SEO → sen onaylarsın → metin yazılır → düzeltmen denetler (gerekirse
    düzelttirir) → sosyal medya ∥ görsel brief → yayın onayı senin.
  icon: pen
  inputs:
    - name: konu
      label: Konu
      label_en: Topic
      type: text
      default: ''
      required: true
    - name: hedef_kitle
      label: Hedef kitle (isteğe bağlı)
      label_en: Target audience (optional)
      type: text
      default: ''
      required: false
  steps:
    - id: brief
      type: agent
      title: İçerik brief'i
      title_en: Content brief
      role: yayin-yonetmeni
      prompt: |
        Konu: "{{input.konu}}"
        Hedef kitle: {{input.hedef_kitle}}

        Bir içerik brief'i yaz: amaç, hedef kitle, ana mesaj, ton, format ve uzunluk, başarı ölçüsü, kaçınılacaklar.
    - id: strateji
      type: agent
      title: Mesaj ve iskelet
      title_en: Message and outline
      role: icerik-stratejisti
      depends_on: [brief]
      prompt: |
        Brief'e göre mesaj mimarisini ve bölüm bölüm içerik iskeletini çıkar; her bölümün amacını bir cümleyle yaz.
    - id: seo
      type: agent
      title: SEO önerileri
      title_en: SEO suggestions
      role: seo
      depends_on: [brief]
      prompt: |
        Brief'e göre arama niyetini, birincil/ikincil anahtar kelime kümelerini, 3 başlık önerisini ve meta açıklamayı yaz.
    - id: iskelet-onay
      type: approval
      title: İskeleti onayla
      title_en: Approve the outline
      message_en: Brief, outline and SEO suggestions are ready. Proceed to writing?
      depends_on: [strateji, seo]
      message: Brief, iskelet ve SEO önerileri hazır. Yazıma geçilsin mi?
    - id: taslak
      type: agent
      title: Metin taslağı
      title_en: Copy draft
      role: metin-yazari
      depends_on: [iskelet-onay]
      prompt: |
        Aşağıdaki brief, iskelet ve SEO önerilerine göre içeriği yaz. Kaynaksız iddia kurma.

        ## Brief
        {{steps.brief.output}}

        ## İskelet
        {{steps.strateji.output}}

        ## SEO
        {{steps.seo.output}}
    - id: duzelti
      type: agent
      title: Düzelti ve kalite denetimi
      title_en: Proofreading and quality review
      role: duzeltmen
      depends_on: [taslak]
      prompt: |
        Beklenen çıktın: **düzelti raporu**. Metni dil bilgisi, doğruluk, marka sesi ve brief'e uygunluk açısından denetle.
        Sorunları "satır → sorun → öneri" biçiminde yaz. Bu sınırlı bir revize döngüsüdür (en fazla 2 tur); sınır dolarsa
        kalan sorunlar insan onayına yükselir, bu yüzden engelleyici maddeleri sonda "İNSAN ONAYINA YÜKSELTİLECEKLER"
        başlığıyla da listele. Senin onayın yayın onayının yerine geçmez. Engelleyici sorun yoksa yalnızca "ONAYLANDI" yaz.

        ## Brief
        {{steps.brief.output}}

        ## Metin
        {{steps.taslak.output}}
      revise:
        target: taslak
        until: ONAYLANDI
        max_rounds: 2
    - id: sosyal
      type: agent
      title: Sosyal medya paylaşımları
      title_en: Social media posts
      role: sosyal-medya
      depends_on: [duzelti]
      prompt: |
        Aşağıdaki onaylı metinden LinkedIn, X ve Instagram için birer paylaşım yaz.

        {{steps.taslak.output}}
    - id: gorsel
      type: agent
      title: Görsel brief
      title_en: Visual brief
      role: gorsel-tasarimci
      depends_on: [duzelti]
      prompt: |
        Aşağıdaki onaylı metin için kapak görseli ve bir infografik fikri tarif et (kompozisyon, renk, tipografi, alt metin).

        {{steps.taslak.output}}
    - id: yayin-onay
      type: approval
      title: Yayın onayı
      title_en: Publication approval
      message_en: Copy, posts and visual brief are ready. Fit to publish?
      depends_on: [sosyal, gorsel]
      message: Metin, paylaşımlar ve görsel brief hazır. Yayına uygun mu?
