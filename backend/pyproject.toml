[project]
name = "voxcrew"
version = "0.1.0"
description = "VoxCrew — yerel yapay zekâ ajanları için voxel dünya, görev, agentic workflow ve graf belleği (Ollama, Codex, Claude Code; Hermes Agent isteğe bağlı)"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"  # PolyForm Shield License 1.0.0, https://polyformproject.org/licenses/shield/1.0.0
authors = [{ name = "Mustafa Uçak", email = "mustafa.ucak@gmail.com" }]
keywords = ["ai-agents", "ollama", "codex", "claude-code", "hermes-agent", "workflow", "knowledge-graph"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Natural Language :: Turkish",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
voxcrew = "studio.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
